name: Build FainsGram Windows EXE

on:
  push:
    branches: [ main, master, fainsgram_release ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC C++ Build Environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Dependencies
        shell: cmd
        run: |
          python Telegram/build/prepare/prepare.py || true

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c

      - name: Build FainsGram Executable
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Package Executable Artifact
        shell: cmd
        run: |
          mkdir artifact
          if exist build\Release\Telegram.exe copy build\Release\Telegram.exe artifact\FainsGram.exe
          if exist build\Release\FainsGram.exe copy build\Release\FainsGram.exe artifact\FainsGram.exe

      - name: Upload FainsGram Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FainsGram_Windows_x64_Installer
          path: artifact/
