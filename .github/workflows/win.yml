name: Windows

on:
  push:
    branches: [ main, fainsgram_release ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git for SSH submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Setup NASM
        uses: ilammy/setup-nasm@v1

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC C++ Build Environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Prepare ThirdParty Dependencies
        shell: cmd
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          python Telegram/build/prepare/prepare.py

      - name: Telegram Desktop build
        run: |
          cmake -B out -G "Ninja" -D TDESKTOP_API_ID=611335 -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D DESKTOP_APP_NO_PDB=ON
          cmake --build out --config Release --parallel

      - name: Move artifact
        run: |
          mkdir artifact
          if exist out\Release\Telegram.exe move out\Release\Telegram.exe artifact\FainsGram.exe
          if exist out\Telegram.exe move out\Telegram.exe artifact\FainsGram.exe
          if exist out\FainsGram.exe move out\FainsGram.exe artifact\FainsGram.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build Windows installer (Inno Setup)
        shell: cmd
        run: |
          if not exist "installer_out" mkdir "installer_out"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /DReleasePath="%GITHUB_WORKSPACE%\artifact" ^
            /DReleaseOut="%GITHUB_WORKSPACE%\installer_out" ^
            /DSourcePath="%GITHUB_WORKSPACE%\Telegram\build" ^
            /DMyAppVersion="1.0.0" ^
            /DMyAppVersionFull="1.0.0" ^
            "packaging\win\fainsgram.iss"
          move /Y "installer_out\FainsGram-x64-*.exe" "artifact\" 2>nul

      - uses: actions/upload-artifact@v4
        name: Upload artifact
        with:
          name: FainsGram_Windows_x64
          path: artifact\
